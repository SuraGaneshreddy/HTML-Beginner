<!DOCTYPE html>
 <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>API Geolocation</title>
    </head>
    <body>
        <h2>This page Demonstrate how to use Geolocation in HTML</h2>
        <button onclick="getLocation()">try it</button>
        <p id="location"></p>
        <script>
            const x = document.getElementById("location");
            function getLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(success, error);
                }else {
                    x.innerHTML = "Geolocaation is not supported by this browser.";
                }
            }
            function success(position) {
                const longitude = position.coords.longitude;
                const latitude = position.coords.latitude;
                x.innerHTML = "longitude:"+ longitude + "<br>latitude:" + latitude;
            }
            function error() {
                x.innerHTML - "Unable to retrive your location.";
            }
        </script>
    </body>
 </html>
