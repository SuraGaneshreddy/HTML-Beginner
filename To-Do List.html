<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="style3.css"/>
</head>

<body>
  <h1>To-To List</h1>
  <ul class="todo-list">
      <li>
          <input type="checkbox" id="checkbox"/>
          <label for="checkbox">Games</label>
          <ul class="sub-item">
              <li><a class="sub-item-link" href="https://www.crazygames.com/t/platform" target="_blank">Game's Platform</a>
       </li>
       </ul>
      <li>
          <input type="checkbox" id="checkbox"/>
          <label for="checkbox">Coding</label>
          <ul class="sub-item">
              <li><a class="sub-item-link" href="https://www.programiz.com/" target="_blank">Coding Platform</a>
              </li>
       </ul>
       <li>
           <input type="checkbox" id="checkbox"/>
           <label for="checkbox">News</label>
           <ul class="sub-item">
               <li><a class="sub-item-link" href="https://news.google.com/home?hl=en-IN&ceid=IN:en&gl=IN" target="_blank">News Platform</a></li>
               </ul>
       <li>
           <input type="checkbox" id="checkbox"/>
           <label for="checkbox">Adventures</label>
           <ul class="sub-item">
               <li><a class="sub-item-link" href="https://adventuring.com/" target="_blank">Adventuring Platform</a></li>
               </ul>
  </ul>
</body>

</html>
