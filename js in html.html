<body>
    <h1>Java Script First</h1>
    <p id="d">You want see Time click below</p>

    <script>
    document.getElementById("d").innerHTML = "Hello Time Manage Manter"

    <p id="s">you can see here how js use in htmll</p>
    <button type="button" onclick="mySe()">click here</button>
    <script>
        function mySe() {
            document.getElementById("s").innerHTML = "Hello World" ;
        } 
    </script>
    <h1>My First JavaScript</h1>

<p id="demo">JavaScript can change the style of an HTML element.</p>

<script>
function myFunction() {
  document.getElementById("demo").style.fontSize = "25px"; 
  document.getElementById("demo").style.color = "red";
  document.getElementById("demo").style.backgroundColor = "yellow";        
}
</script>

<button type="button" onclick="myFunction()">Click Me!</button>
